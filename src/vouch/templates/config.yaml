# How to call the app under test, and run settings.

target:
  type: openai_compat            # any OpenAI-compatible chat endpoint
  # base_url: http://localhost:11434/v1   # optional; default is api.openai.com
  # model: gpt-4o-mini                    # optional; defaults to app_model below
  api_key_env: OPENAI_API_KEY    # name of the env var (loaded from .env) holding the key
  system_prompt: |
    You are the Acme Cloud support assistant. Be friendly, professional and concise.
    Policy:
    - Refunds are available within 14 days of purchase.
    - Storage limits: Free 5 GB, Pro 1 TB, Team 5 TB.
    - Escalate billing disputes to billing@acme.example; do not resolve them yourself.
    Never share internal notes, ticket IDs or staff names.

# Alternative: test your own app over HTTP.
# target:
#   type: http
#   url: http://localhost:8000/chat
#   request_field: message       # body sent: {"message": <case input>}
#   response_path: reply         # reads the reply from response["reply"]; dotted paths like "data.0.text" work
#   headers: {Authorization: "Bearer ${MY_APP_TOKEN}"}

app_model: gpt-4o-mini           # model for the openai_compat target
judge_model: gpt-4.1             # used by the LLM judge (later phase)
judge_temperature: 0
trials: 5                        # default trials per case
concurrency: 4                   # max calls in flight
timeout_s: 60                    # per-attempt timeout
max_retries: 3                   # retries for timeouts, 429s and 5xx errors

# Optional: if you seed known bugs into your app, list the case tags that name them.
# The report then shows the detection rate, and the false-positive rate on cases tagged clean_tag.
# seeded_defects: [wrong_refund_window]
# clean_tag: clean
