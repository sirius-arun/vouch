name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # No secrets are configured: the tests mock every LLM and HTTP call.
      - name: Run tests
        run: pytest -q

      - name: CLI smoke test
        run: |
          vouch --help
          vouch init "$RUNNER_TEMP/suite"
