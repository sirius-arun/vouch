[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vouch"
version = "0.1.0"
description = "Contextual testing kit for LLM apps: test outputs against a product context pack with repeated trials, evidence-quoting LLM judges and pass^k."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arunanshu Sinha" }]
keywords = [
    "llm", "evaluation", "testing", "llm-as-judge", "pass^k",
    "genai", "qa", "chatbot", "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openai>=1.40",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/sirius-arun/vouch"
Repository = "https://github.com/sirius-arun/vouch"
Issues = "https://github.com/sirius-arun/vouch/issues"

[project.scripts]
vouch = "vouch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vouch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
